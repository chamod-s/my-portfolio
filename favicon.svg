<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Circle/Rounded Square -->
  <rect width="512" height="512" rx="128" fill="#090d16"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#favGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="8"/>

  <!-- CS Monogram Text -->
  <g font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="240" letter-spacing="-12" text-anchor="middle">
    <text x="256" y="330" fill="#ffffff" filter="url(#glow)">CS</text>
  </g>
</svg>
